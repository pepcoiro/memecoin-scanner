<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memecoin Scanner — Solana</title>
<style>
:root{--bg:#080a0f;--panel:#11151d;--text:#f4f7fb;--muted:#8f9bad;--line:#232b38;--accent:#8b5cf6;--green:#22c55e;--yellow:#f59e0b;--red:#ef4444}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17112f 0,#080a0f 44%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:1480px;margin:auto;padding:28px 22px 50px}
.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:22px}.brand h1{margin:0;font-size:30px;letter-spacing:-.03em}.brand p{margin:7px 0 0;color:var(--muted)}.status{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 14px rgba(34,197,94,.7)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}.stat{background:rgba(17,21,29,.84);border:1px solid var(--line);border-radius:15px;padding:16px}.stat span{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}.stat strong{display:block;margin-top:6px;font-size:24px}
.toolbar{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:16px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 12px;border-radius:999px;cursor:pointer}.filter.active{color:#fff;border-color:#6650a7;background:#211b37}.search{background:var(--panel);border:1px solid var(--line);color:#fff;padding:10px 13px;border-radius:10px;min-width:260px;outline:none}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:linear-gradient(180deg,rgba(23,28,38,.97),rgba(14,18,25,.97));border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 14px 35px rgba(0,0,0,.18)}.card.hot{border-color:#5a3fa2;box-shadow:0 0 0 1px rgba(139,92,246,.18),0 18px 45px rgba(0,0,0,.25)}
.head{display:flex;justify-content:space-between;gap:10px}.token{display:flex;gap:12px;align-items:center}.avatar{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#22d3ee);display:grid;place-items:center;font-weight:800}.sym{font-size:18px;font-weight:800}.name{font-size:12px;color:var(--muted);margin-top:2px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{min-width:62px;text-align:right}.score b{font-size:25px}.score small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.badge{padding:5px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line);color:var(--muted)}.pass{color:#86efac;border-color:#1f6a3a;background:rgba(34,197,94,.08)}.risk{color:#fca5a5;border-color:#7f3030;background:rgba(239,68,68,.08)}.warn{color:#fcd34d;border-color:#795517;background:rgba(245,158,11,.08)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:13px 0}.metric{background:#0d1118;border:1px solid #1e2632;border-radius:11px;padding:9px}.metric span{display:block;color:var(--muted);font-size:10px}.metric strong{display:block;margin-top:3px;font-size:14px}.rows{display:grid;gap:7px;margin:12px 0 15px}.row{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px}.row b{color:#e8edf5;font-weight:700}
.actions{display:flex;gap:8px}.buy{flex:1;text-decoration:none;text-align:center;background:linear-gradient(135deg,#8b5cf6,#6d3df2);color:#fff;font-weight:800;padding:11px;border-radius:10px}.buy.off{opacity:.35;pointer-events:none}.dex{display:block;text-decoration:none;color:#aeb8c7;border:1px solid #2a3341;padding:11px 12px;border-radius:10px}.empty{padding:55px 20px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted);grid-column:1/-1}.footer{margin-top:20px;color:var(--muted);font-size:11px;text-align:center}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.top,.toolbar{flex-direction:column;align-items:stretch}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.search{min-width:0;width:100%}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="brand"><h1>MEMECOIN SCANNER <span style="color:#8b5cf6">/ SOLANA</span></h1><p>Market data · momentum · security · Jupiter routing</p></div><div class="status"><i class="dot"></i><span id="updated">Caricamento…</span></div></div>
<div class="stats"><div class="stat"><span>Candidati</span><strong id="candidates">—</strong></div><div class="stat"><span>Alert</span><strong id="alerts">—</strong></div><div class="stat"><span>Jupiter route</span><strong id="routes">—</strong></div><div class="stat"><span>Auto refresh</span><strong>30s</strong></div></div>
<div class="toolbar"><div class="filters"><button class="filter active" data-filter="all">Tutti</button><button class="filter" data-filter="strong">Strong</button><button class="filter" data-filter="interesting">Interesting</button><button class="filter" data-filter="route">Jupiter ✅</button></div><input id="search" class="search" placeholder="Cerca token o contract…"></div>
<div id="grid" class="grid"><div class="empty">Caricamento scanner…</div></div>
<div class="footer">La size massima è una stima teorica basata sulla liquidità del pool. Verifica sempre lo swap prima di confermare.</div>
</div>
<script>
let DATA={tokens:[]},FILTER="all",QUERY="";
const $=function(id){return document.getElementById(id)};
function money(x){return new Intl.NumberFormat("it-IT",{notation:"compact",maximumFractionDigits:1}).format(x||0)}
function pct(x){return (x>=0?"+":"")+Number(x||0).toFixed(1)+"%"}
function badgeClass(s){return s==="PASS"?"pass":(s==="RISK"||s==="NO_ROUTE"?"risk":"warn")}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&#92;",""":"&quot;","'":"&#39;"}[m]})}
function render(){
 let list=(DATA.tokens||[]).filter(function(t){
  let q=QUERY.toLowerCase(),hit=!q||(t.symbol+" "+t.name+" "+t.address).toLowerCase().indexOf(q)>=0;
  let f=FILTER==="all"||(FILTER==="strong"&&String(t.level).indexOf("STRONG")>=0)||(FILTER==="interesting"&&String(t.level).indexOf("INTERESTING")>=0)||(FILTER==="route"&&t.jupiter.status==="PASS");
  return hit&&f;
 });
 if(!list.length){$("grid").innerHTML='<div class="empty">Nessun token corrisponde ai filtri.</div>';return}
 list.sort(function(a,b){return b.score-a.score});
 $("grid").innerHTML=list.map(function(t){
  let initials=(t.symbol||"?").slice(0,2).toUpperCase(),sec=t.security||{},j=t.jupiter||{},hot=String(t.level).indexOf("STRONG")>=0?" hot":"";
  let level=String(t.level).indexOf("STRONG")>=0?"🔥 STRONG":String(t.level).indexOf("INTERESTING")>=0?"🟢 INTERESTING":"";
  let buy=j.status==="PASS"?'<a class="buy" href="'+esc(t.jupiter_url)+'" target="_blank" rel="noopener">🟣 COMPRA SU JUPITER</a>':'<a class="buy off" href="#">🟣 NESSUNA ROTTA JUPITER</a>';
  return '<article class="card'+hot+'"><div class="head"><div class="token"><div class="avatar">'+esc(initials)+'</div><div><div class="sym">'+esc(t.symbol)+'</div><div class="name" title="'+esc(t.name)+'">'+esc(t.name)+'</div></div></div><div class="score"><b>'+Number(t.score||0)+'</b><small>score</small></div></div>'+
   '<div class="badges">'+(level?'<span class="badge">'+level+'</span>':'')+'<span class="badge '+badgeClass(sec.status)+'">SEC '+esc(sec.status)+'</span><span class="badge '+badgeClass(j.status)+'">JUP '+esc(j.status)+'</span></div>'+
   '<div class="metrics"><div class="metric"><span>Liquidity</span><strong>$'+money(t.liquidity)+'</strong></div><div class="metric"><span>Market Cap</span><strong>$'+money(t.market_cap)+'</strong></div><div class="metric"><span>Vol 1h</span><strong>$'+money(t.volume_1h)+'</strong></div></div>'+
   '<div class="rows"><div class="row"><span>Volume burst</span><b>'+Number(t.burst||0).toFixed(2)+'x</b></div><div class="row"><span>Buy pressure</span><b>'+Number(t.buy_pressure||0).toFixed(1)+'%</b></div><div class="row"><span>Price 1h / 24h</span><b>'+pct(t.price_1h)+' / '+pct(t.price_24h)+'</b></div><div class="row"><span>Max teorico</span><b>$'+Number(t.max_position_usd||0).toFixed(0)+' · '+Number(t.max_position_sol||0).toFixed(3)+' SOL</b></div></div>'+
   '<div class="actions">'+buy+'<a class="dex" href="'+esc(t.url)+'" target="_blank" rel="noopener">DEX</a></div></article>';
 }).join("");
}
async function load(){
 try{
  let r=await fetch("data.json?ts="+Date.now(),{cache:"no-store"});DATA=await r.json();
  $("candidates").textContent=DATA.candidate_count||0;$("alerts").textContent=DATA.alert_count||0;
  $("routes").textContent=(DATA.tokens||[]).filter(function(t){return t.jupiter.status==="PASS"}).length;
  $("updated").textContent="Ultima scansione: "+new Date(DATA.generated_at).toLocaleString("it-IT");render();
 }catch(e){$("grid").innerHTML='<div class="empty">Impossibile leggere i dati dello scanner.</div>'}
}
document.querySelectorAll(".filter").forEach(function(b){b.onclick=function(){document.querySelectorAll(".filter").forEach(function(x){x.classList.remove("active")});b.classList.add("active");FILTER=b.dataset.filter;render()}});
$("search").oninput=function(e){QUERY=e.target.value;render()};load();setInterval(load,30000);
</script>
</body></html>
