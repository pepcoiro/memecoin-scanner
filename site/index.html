<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memecoin Scanner — Solana</title>
<style>
:root{--bg:#07090e;--panel:#10141c;--text:#f4f7fb;--muted:#8f9aaa;--line:#242c39;--purple:#8b5cf6;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#201743 0,#07090e 48%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:28px 22px 50px}
.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.brand h1{margin:0;font-size:31px;letter-spacing:-.04em}.brand p{margin:7px 0 0;color:var(--muted)}.status{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 14px rgba(34,197,94,.65)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat{background:rgba(16,20,28,.88);border:1px solid var(--line);border-radius:16px;padding:15px}.stat span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.stat strong{display:block;margin-top:6px;font-size:24px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 12px;border-radius:999px;cursor:pointer}.filter.active{color:#fff;background:#241c3d;border-color:#6b4ec2}.search{background:var(--panel);border:1px solid var(--line);color:#fff;padding:10px 13px;border-radius:11px;min-width:270px;outline:none}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:linear-gradient(180deg,rgba(21,27,37,.98),rgba(13,17,24,.98));border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 15px 40px rgba(0,0,0,.18)}.card.hot{border-color:#5b46a5;box-shadow:0 0 0 1px rgba(139,92,246,.16),0 20px 48px rgba(0,0,0,.25)}
.head{display:flex;justify-content:space-between;gap:10px}.token{display:flex;gap:12px;align-items:center}.avatar{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#8b5cf6,#22d3ee);display:grid;place-items:center;font-weight:900}.sym{font-size:18px;font-weight:850}.name{font-size:12px;color:var(--muted);margin-top:2px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{text-align:right}.score b{font-size:26px}.score small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.badge{padding:5px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line);color:var(--muted)}.green{color:#86efac;border-color:#1f6a3a;background:rgba(34,197,94,.08)}.yellow{color:#fcd34d;border-color:#795517;background:rgba(245,158,11,.08)}.red{color:#fca5a5;border-color:#7f3030;background:rgba(239,68,68,.08)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:13px 0}.metric{background:#0c1017;border:1px solid #1d2531;border-radius:11px;padding:9px}.metric span{display:block;color:var(--muted);font-size:10px}.metric strong{display:block;margin-top:3px;font-size:14px}.rows{display:grid;gap:7px;margin:12px 0 15px}.row{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px}.row b{color:#e9edf5}
.actions{display:flex;gap:8px}.buy{flex:1;text-decoration:none;text-align:center;background:linear-gradient(135deg,#8b5cf6,#6f3ff2);color:#fff;font-weight:850;padding:11px;border-radius:10px}.dex{color:#c0c8d4;text-decoration:none;border:1px solid #2b3441;padding:11px 12px;border-radius:10px}
.empty{grid-column:1/-1;padding:60px 20px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}.footer{margin-top:20px;color:var(--muted);font-size:11px;text-align:center}

@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.top,.toolbar{flex-direction:column;align-items:stretch}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.search{width:100%;min-width:0}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="brand"><h1>MEMECOIN SCANNER <span style="color:#8b5cf6">/ SOLANA</span></h1><p>DexScreener live filter · momentum · liquidity · buy pressure</p></div><div class="status"><i class="dot"></i><span id="status">Connessione a DexScreener…</span></div></div>
<div class="stats"><div class="stat"><span>Coppie analizzate</span><strong id="pairs">—</strong></div><div class="stat"><span>Candidati</span><strong id="candidates">—</strong></div><div class="stat"><span>Strong</span><strong id="strong">—</strong></div><div class="stat"><span>Ultimo refresh</span><strong id="refresh">—</strong></div></div>
<div class="toolbar"><div class="filters"><button class="filter active" data-filter="all">Tutti</button><button class="filter" data-filter="strong">🔥 Strong</button><button class="filter" data-filter="interesting">🟢 Interesting</button><button class="filter" data-filter="watch">🟡 Watch</button><button class="filter" data-filter="fresh">🆕 &lt;24h</button></div><input id="search" class="search" placeholder="Cerca simbolo, nome o contract…"></div>
<div id="grid" class="grid"><div class="empty">Scansione DexScreener in corso…</div></div>
<div class="footer">Dati direttamente da DexScreener. Il pulsante Terminal apre direttamente la pagina del token.</div>
</div>


<script>
const API="https://api.dexscreener.com";
const PROFILE_LIMIT=150;
const BATCH=25;
const DISCOVERY_MS=30000;
const MONITOR_MS=3000;
const STATE_KEY="memecoin_scanner_v1";
let allPairs=[];
let currentFilter="all";
let currentQuery="";

function n(x){const v=Number(x);return Number.isFinite(v)?v:0}
function money(x){return new Intl.NumberFormat("it-IT",{notation:"compact",maximumFractionDigits:1}).format(n(x))}
function pct(x){return (n(x)>=0?"+":"")+n(x).toFixed(1)+"%"}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]})}
function age(p){const c=n(p.pairCreatedAt);return c?Math.max(0,(Date.now()-c)/3600000):999999}
function bp(p){const t=p.txns&&p.txns.h1?p.txns.h1:{},b=n(t.buys),s=n(t.sells);return b+s?b/(b+s):0}
function burst(p){const v1=n(p.volume&&p.volume.h1),v24=n(p.volume&&p.volume.h24);return v24?v1*24/v24:0}
function previous(){try{return JSON.parse(localStorage.getItem(STATE_KEY)||"{}")}catch(e){return {}}}
function savePrevious(v){try{localStorage.setItem(STATE_KEY,JSON.stringify(v))}catch(e){}}
function terminal(addr){return "https://trade.padre.gg/trade/solana/"+encodeURIComponent(addr)}

function score(p,old){
 const liq=n(p.liquidity&&p.liquidity.usd),mc=n(p.marketCap||p.fdv),v1=n(p.volume&&p.volume.h1),v24=n(p.volume&&p.volume.h24);
 const p1=n(p.priceChange&&p.priceChange.h1),p6=n(p.priceChange&&p.priceChange.h6),p24=n(p.priceChange&&p.priceChange.h24);
 const pressure=bp(p),bu=burst(p);let s=0;
 if(mc<=500000)s+=15;else if(mc<=2000000)s+=11;else s+=6;
 if(liq>=250000)s+=20;else if(liq>=100000)s+=17;else if(liq>=50000)s+=14;else s+=9;
 const vm=mc?v24/mc:0;if(vm>=2)s+=15;else if(vm>=1)s+=12;else if(vm>=.5)s+=8;else if(vm>=.2)s+=4;
 if(v1>=150000)s+=15;else if(v1>=75000)s+=12;else if(v1>=25000)s+=9;else if(v1>=10000)s+=5;
 if(bu>=3)s+=10;else if(bu>=2)s+=8;else if(bu>=1.5)s+=6;else if(bu>=1.25)s+=3;
 if(pressure>=.68)s+=10;else if(pressure>=.60)s+=8;else if(pressure>=.55)s+=6;else if(pressure>=.50)s+=3;else if(pressure<.42)s-=5;
 const tx=n(p.txns&&p.txns.h1&&p.txns.h1.buys)+n(p.txns&&p.txns.h1&&p.txns.h1.sells);
 if(tx>=250)s+=5;else if(tx>=100)s+=4;else if(tx>=40)s+=2;else if(tx<20)s-=3;
 if(5<=p1&&p1<=30)s+=5;else if(p1>0&&p1<5)s+=2;else if(p1<-20)s-=5;
 if(10<=p6&&p6<=80)s+=5;else if(p6<-25)s-=4;
 const a=age(p);if(a<=3)s+=5;else if(a<=12)s+=4;else if(a<=24)s+=3;else if(a<=72)s+=1;
 const vl=liq?v1/liq:0;if(vl>=25)s-=25;else if(vl>=15)s-=18;else if(vl>=10)s-=10;
 if(p1>100)s-=20;else if(p1>60)s-=12;
 if(p24>800)s-=35;else if(p24>500)s-=30;else if(p24>300)s-=22;else if(p24>150)s-=15;else if(p24>100)s-=9;else if(p24>60)s-=5;
 let acc=0,has=false;
 if(old[p.pairAddress]&&n(old[p.pairAddress].v1)){has=true;acc=v1/n(old[p.pairAddress].v1);if(acc>=3)s+=7;else if(acc>=2)s+=5;else if(acc>=1.5)s+=3;else if(acc<.65)s-=2}
 return {score:Math.max(0,Math.min(100,Math.round(s))),burst:bu,accel:acc,hasAccel:has,bp:pressure};
}
function enrich(p,old){const m=score(p,old);let level="";if(m.score>=75&&(m.burst>=2||m.hasAccel))level="STRONG";else if(m.score>=60&&(m.burst>=1.5||m.bp>=.55))level="INTERESTING";else if(m.score>=50&&(m.burst>=1.1||m.bp>=.50))level="WATCH";p._m=m;p._level=level;return p}
function passes(p){const liq=n(p.liquidity&&p.liquidity.usd),mc=n(p.marketCap||p.fdv),v24=n(p.volume&&p.volume.h24);return liq>=20000&&mc>=20000&&mc<=10000000&&v24>=20000}
function classify(p){const p1=n(p.priceChange&&p.priceChange.h1),p24=n(p.priceChange&&p.priceChange.h24);return !(p1>60||p24>150||p1<=-30||p24<=-50)&&!!p._level}

async function getJSON(url){const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
async function discover(){
 const [profiles,boosts]=await Promise.all([getJSON(API+"/token-profiles/latest/v1"),getJSON(API+"/token-boosts/latest/v1").catch(function(){return []})]);
 const addresses=[...(profiles||[]),...(boosts||[])].filter(function(x){return String(x.chainId||"").toLowerCase()==="solana"&&x.tokenAddress}).map(function(x){return x.tokenAddress});
 const unique=[...new Set(addresses)].slice(0,PROFILE_LIMIT);
 const chunks=[];for(let i=0;i<unique.length;i+=BATCH)chunks.push(unique.slice(i,i+BATCH));
 const responses=await Promise.all(chunks.map(function(c){return getJSON(API+"/tokens/v1/solana/"+c.join(","))}));
 const pairs=responses.flat().filter(function(p){return String(p.chainId||"").toLowerCase()==="solana"});
 const seen=new Set(),dedup=[];for(const p of pairs){if(!p.pairAddress||seen.has(p.pairAddress))continue;seen.add(p.pairAddress);dedup.push(p)}
 return dedup;
}

function render(){
 let list=allPairs.filter(function(p){
  const q=currentQuery.toLowerCase(),text=(p.baseToken?.symbol||"")+" "+(p.baseToken?.name||"")+" "+(p.baseToken?.address||"");
  const hit=!q||text.toLowerCase().includes(q);
  const f=currentFilter==="all"||(currentFilter==="strong"&&p._level==="STRONG")||(currentFilter==="interesting"&&p._level==="INTERESTING")||(currentFilter==="watch"&&p._level==="WATCH")||(currentFilter==="fresh"&&age(p)<=24);
  return hit&&f;
 }).sort(function(a,b){return b._m.score-a._m.score});
 if(!list.length){document.getElementById("grid").innerHTML='<div class="empty">Nessun token corrisponde ai filtri.</div>';return}
 document.getElementById("grid").innerHTML=list.map(function(p){
  const t=p.baseToken||{},m=p._m||{},a=age(p),hot=p._level==="STRONG";
  const initials=(t.symbol||"?").slice(0,2).toUpperCase();
  return '<article class="card'+(hot?" hot":"")+'"><div class="head"><div class="token"><div class="avatar">'+esc(initials)+'</div><div><div class="sym">'+esc(t.symbol||"?")+'</div><div class="name" title="'+esc(t.name||"")+'">'+esc(t.name||"")+'</div></div></div><div class="score"><b>'+m.score+'</b><small>score</small></div></div>'+
  '<div class="badges">'+(p._level?'<span class="badge '+(hot?"red":(p._level==="WATCH"?"yellow":"green"))+'">'+(hot?"🔥 STRONG":(p._level==="WATCH"?"🟡 WATCH":"🟢 INTERESTING"))+'</span>':'')+(a<=24?'<span class="badge yellow">🆕 '+a.toFixed(1)+'h</span>':'')+'<span class="badge">'+esc(p.dexId||"?")+'</span></div>'+
  '<div class="metrics"><div class="metric"><span>Liquidity</span><strong>$'+money(p.liquidity&&p.liquidity.usd)+'</strong></div><div class="metric"><span>Market Cap</span><strong>$'+money(p.marketCap||p.fdv)+'</strong></div><div class="metric"><span>Vol 1h</span><strong>$'+money(p.volume&&p.volume.h1)+'</strong></div></div>'+
  '<div class="rows"><div class="row"><span>Volume burst</span><b>'+m.burst.toFixed(2)+'x</b></div><div class="row"><span>Buy pressure</span><b>'+(m.bp*100).toFixed(1)+'%</b></div><div class="row"><span>Accelerazione</span><b>'+(m.hasAccel?m.accel.toFixed(2)+"x":"N/D")+'</b></div><div class="row"><span>Price 1h / 24h</span><b>'+pct(p.priceChange&&p.priceChange.h1)+' / '+pct(p.priceChange&&p.priceChange.h24)+'</b></div></div>'+
  '<div class="actions"><a class="buy" href="'+terminal(t.address||"")+'" target="_blank" rel="noopener">🟣 APRI TERMINAL</a><a class="dex" href="'+esc(p.url||"#")+'" target="_blank" rel="noopener">DEX</a></div></article>';
 }).join("");
}

async function dedupeAndRank(pairs,old){
 const filtered=pairs.filter(passes).map(function(p){return enrich(p,old)}).filter(classify);
 filtered.sort(function(a,b){return b._m.score-a._m.score});
 const byToken=new Map();
 for(const p of filtered){
  const k=p.baseToken?.address||p.pairAddress;
  if(!byToken.has(k))byToken.set(k,p);
 }
 return [...byToken.values()];
}

async function discoverScan(){
 document.getElementById("status").textContent="Discovery DexScreener…";
 try{
  const old=previous(),pairs=await discover();
  allPairs=await dedupeAndRank(pairs,old);
  const next={};
  for(const p of allPairs) next[p.pairAddress]={v1:n(p.volume&&p.volume.h1),ts:Date.now()};
  savePrevious(next);
  document.getElementById("pairs").textContent=pairs.length;
  document.getElementById("candidates").textContent=allPairs.length;
  document.getElementById("strong").textContent=allPairs.filter(function(p){return p._level==="STRONG"}).length;
  document.getElementById("refresh").textContent=new Date().toLocaleTimeString("it-IT");
  document.getElementById("status").textContent="Live · discovery 30s · monitor 3s";
  render();
 }catch(e){
  document.getElementById("status").textContent="Errore DexScreener";
  document.getElementById("grid").innerHTML='<div class="empty"><b>Impossibile leggere DexScreener.</b><br><br>'+esc(e.message)+'</div>';
 }
}

async function monitorScan(){
 if(!allPairs.length)return;
 const addresses=[...new Set(allPairs.map(function(p){return p.baseToken?.address}).filter(Boolean))];
 if(!addresses.length)return;
 try{
  const old=previous();
  const chunks=[];
  for(let i=0;i<addresses.length;i+=BATCH)chunks.push(addresses.slice(i,i+BATCH));
  const responses=await Promise.all(chunks.map(function(chunk){
   return getJSON(API+"/tokens/v1/solana/"+chunk.join(","));
  }));
  const livePairs=responses.flat().filter(function(p){return String(p.chainId||"").toLowerCase()==="solana"});
  const previousCount=allPairs.length;
  const updated=await dedupeAndRank(livePairs,old);
  allPairs=updated;
  document.getElementById("candidates").textContent=allPairs.length;
  document.getElementById("strong").textContent=allPairs.filter(function(p){return p._level==="STRONG"}).length;
  document.getElementById("refresh").textContent=new Date().toLocaleTimeString("it-IT");
  document.getElementById("status").textContent="Live · dati ogni 3s · discovery ogni 30s";
  render();
 }catch(e){
  document.getElementById("status").textContent="Live · monitor in pausa";
 }
}

document.querySelectorAll(".filter").forEach(function(b){b.onclick=function(){document.querySelectorAll(".filter").forEach(function(x){x.classList.remove("active")});b.classList.add("active");currentFilter=b.dataset.filter;render()}});
document.getElementById("search").oninput=function(e){currentQuery=e.target.value;render()};

discoverScan();
setInterval(discoverScan,DISCOVERY_MS);
setInterval(monitorScan,MONITOR_MS);
</script>
</body>
</html>
