<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Memecoin Scanner — Solana</title>
<style>
:root{--bg:#07090e;--panel:#10141c;--text:#f4f7fb;--muted:#8f9aaa;--line:#242c39;--purple:#8b5cf6;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#201743 0,#07090e 48%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:28px 22px 50px}
.top{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.notify{border:1px solid #3a314f;background:#171322;color:#d8ccff;padding:7px 10px;border-radius:9px;cursor:pointer;font-size:12px;font-weight:750}.notify:hover{border-color:#6b4ec2;background:#211a31}.notify:disabled{opacity:.6;cursor:default}.brand h1{margin:0;font-size:31px;letter-spacing:-.04em}.brand p{margin:7px 0 0;color:var(--muted)}.status{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:13px}.dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 14px rgba(34,197,94,.65)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat{background:rgba(16,20,28,.88);border:1px solid var(--line);border-radius:16px;padding:15px}.stat span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.stat strong{display:block;margin-top:6px;font-size:24px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filter{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 12px;border-radius:999px;cursor:pointer}.filter.active{color:#fff;background:#241c3d;border-color:#6b4ec2}.search{background:var(--panel);border:1px solid var(--line);color:#fff;padding:10px 13px;border-radius:11px;min-width:270px;outline:none}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:linear-gradient(180deg,rgba(21,27,37,.98),rgba(13,17,24,.98));border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 15px 40px rgba(0,0,0,.18)}.card.hot{border-color:#5b46a5;box-shadow:0 0 0 1px rgba(139,92,246,.16),0 20px 48px rgba(0,0,0,.25)}
.head{display:flex;justify-content:space-between;gap:10px}.token{display:flex;gap:12px;align-items:center}.avatar{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#8b5cf6,#22d3ee);display:grid;place-items:center;font-weight:900}.sym{font-size:18px;font-weight:850}.name{font-size:12px;color:var(--muted);margin-top:2px;max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{text-align:right}.score b{font-size:26px}.score small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.badge{padding:5px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line);color:var(--muted)}.green{color:#86efac;border-color:#1f6a3a;background:rgba(34,197,94,.08)}.yellow{color:#fcd34d;border-color:#795517;background:rgba(245,158,11,.08)}.red{color:#fca5a5;border-color:#7f3030;background:rgba(239,68,68,.08)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:13px 0}.metric{background:#0c1017;border:1px solid #1d2531;border-radius:11px;padding:9px}.metric span{display:block;color:var(--muted);font-size:10px}.metric strong{display:block;margin-top:3px;font-size:14px}.rows{display:grid;gap:7px;margin:12px 0 15px}.planrow{border:1px solid #202936;background:#0c1017;border-radius:11px;padding:10px;font-size:11px;color:#aeb7c4;text-align:center}.planrow b{color:#fff}.row{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px}.row b{color:#e9edf5}
.actions{display:flex;gap:8px}.buy{flex:1;text-decoration:none;text-align:center;background:linear-gradient(135deg,#8b5cf6,#6f3ff2);color:#fff;font-weight:850;padding:11px;border-radius:10px}.dex{color:#c0c8d4;text-decoration:none;border:1px solid #2b3441;padding:11px 12px;border-radius:10px}
.empty{grid-column:1/-1;padding:60px 20px;text-align:center;border:1px dashed var(--line);border-radius:18px;color:var(--muted)}.footer{margin-top:20px;color:var(--muted);font-size:11px;text-align:center}

@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){.top,.toolbar{flex-direction:column;align-items:stretch}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.search{width:100%;min-width:0}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="brand"><h1>MEMECOIN SCANNER <span style="color:#8b5cf6">/ SOLANA</span></h1><p>DexScreener discovery · Solana WebSocket · momentum · liquidity · buy pressure</p></div><div class="status"><button id="notifyBtn" class="notify" type="button">🔔 Attiva notifiche</button><i class="dot"></i><span id="status">Connessione a DexScreener…</span></div></div>
<div class="stats"><div class="stat"><span>Coppie analizzate</span><strong id="pairs">—</strong></div><div class="stat"><span>Candidati</span><strong id="candidates">—</strong></div><div class="stat"><span>Strong</span><strong id="strong">—</strong></div><div class="stat"><span>Ultimo refresh</span><strong id="refresh">—</strong></div></div>
<div class="toolbar"><div class="filters"><button class="filter active" data-filter="all">Tutti</button><button class="filter" data-filter="strong">🔥 Strong</button><button class="filter" data-filter="interesting">🟢 Interesting</button><button class="filter" data-filter="watch">🟡 Watch</button><button class="filter" data-filter="birth">🆕 Birth</button><button id="freshFilter" class="filter" data-filter="fresh">🆕 &lt;24h</button></div><input id="search" class="search" placeholder="Cerca simbolo, nome o contract…"></div>
<div id="grid" class="grid"><div class="empty">Scansione DexScreener in corso…</div></div>
<div class="footer">DexScreener discovery + realtime Solana WebSocket · Terminal per il trading.</div>
</div>


<script>
const API="https://api.dexscreener.com";
const PROFILE_LIMIT=150;
const BATCH=25;
const DISCOVERY_MS=30000;
const WS_URL="wss://api.mainnet.solana.com/";
const WS_MAX_PAIRS=80;
const WS_REFRESH_DEBOUNCE_MS=700;
const WS_RECONNECT_MS=5000;
const FALLBACK_MONITOR_MS=10000;
const STATE_KEY="memecoin_scanner_v1";
let allPairs=[];
let currentFilter="all";
let currentQuery="";
let ws=null;
let wsSubIds=new Map();
let wsPairBySub=new Map();
let wsTokenByPair=new Map();
let wsBirthBySub=new Map();
const birthCandidates=new Map();
const birthSeenSignatures=new Set();
let birthResolveTimer=null;
let wsPending=new Set();
let wsFlushTimer=null;
let wsReconnectTimer=null;
let wsGeneration=0;
let fallbackTimer=null;
const NOTIFY_STATE_KEY="memecoin_scanner_notifications_v1";
let notificationsEnabled=false;
let notificationsArmed=false;
const knownLevels=new Map();
const strongSignals=new Map();
const STRONG_ENTER_SCORE=75;
const STRONG_EXIT_SCORE=65;
const SECURITY_CACHE_MS=45000;
const SECURITY_MAX_TOKENS=8;
const securityCache=new Map();
let securityBusy=false;

function n(x){const v=Number(x);return Number.isFinite(v)?v:0}
function money(x){return new Intl.NumberFormat("it-IT",{notation:"compact",maximumFractionDigits:1}).format(n(x))}
function pct(x){return (n(x)>=0?"+":"")+n(x).toFixed(1)+"%"}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]})}
function age(p){const c=n(p.pairCreatedAt);return c?Math.max(0,(Date.now()-c)/3600000):999999}
function bp(p){const t=p.txns&&p.txns.h1?p.txns.h1:{},b=n(t.buys),s=n(t.sells);return b+s?b/(b+s):0}
function burst(p){const v1=n(p.volume&&p.volume.h1),v24=n(p.volume&&p.volume.h24);return v24?v1*24/v24:0}
function previous(){try{return JSON.parse(localStorage.getItem(STATE_KEY)||"{}")}catch(e){return {}}}
function savePrevious(v){try{localStorage.setItem(STATE_KEY,JSON.stringify(v))}catch(e){}}
function terminal(addr){return "https://trade.padre.gg/trade/solana/"+encodeURIComponent(addr)}
function updateNotifyButton(){
 const btn=document.getElementById("notifyBtn");
 if(!btn)return;
 if(!("Notification" in window)){btn.textContent="🔕 Notifiche non supportate";btn.disabled=true;return}
 if(Notification.permission==="granted"){notificationsEnabled=true;btn.textContent="🔔 Notifiche attive";btn.title="Notifiche Strong attive"}
 else if(Notification.permission==="denied"){notificationsEnabled=false;btn.textContent="🔕 Notifiche bloccate";btn.title="Abilita le notifiche dalle impostazioni del browser"}
 else{btn.textContent="🔔 Attiva notifiche";btn.title="Ricevi una notifica quando un token entra in STRONG"}
}
function notifyStrong(p){
 if(!notificationsEnabled||!notificationsArmed||!("Notification" in window)||Notification.permission!=="granted")return;
 const t=p.baseToken||{},symbol=t.symbol||"TOKEN",address=t.address||"";
 const body="Score "+n(p._m&&p._m.score)+" · MC $"+money(p.marketCap||p.fdv)+" · Liquidity $"+money(p.liquidity&&p.liquidity.usd);
 try{
  const note=new Notification("🔥 STRONG — $"+symbol,{body:body,tag:"memecoin-strong-"+address,renotify:false});
  note.onclick=function(){window.focus();if(address)window.open(terminal(address),"_blank","noopener");note.close()};
 }catch(e){}
}
function checkStrongNotifications(pairs){
 const present=new Set();
 for(const p of pairs){
  const address=p.baseToken?.address;
  if(!address)continue;
  present.add(address);
  if(!p._securityReady)continue;
  const level=p._level||"";
  const previousLevel=knownLevels.get(address);
  if(level==="STRONG"&&previousLevel!=="STRONG")notifyStrong(p);
  knownLevels.set(address,level);
 }
 for(const address of [...knownLevels.keys()])if(!present.has(address))knownLevels.delete(address);
 for(const address of [...strongSignals.keys()])if(!present.has(address))strongSignals.delete(address);
 notificationsArmed=true;
}
function enableNotifications(){
 if(!("Notification" in window)){updateNotifyButton();return}
 if(Notification.permission==="granted"){notificationsEnabled=true;updateNotifyButton();return}
 if(Notification.permission==="denied"){notificationsEnabled=false;updateNotifyButton();return}
 Notification.requestPermission().then(function(permission){
  notificationsEnabled=permission==="granted";
  updateNotifyButton();
  if(notificationsEnabled){
   try{new Notification("🔔 Notifiche attive",{body:"Ti avviserò quando un token entra in STRONG.",tag:"memecoin-notifications-enabled"})}catch(e){}
  }
 }).catch(function(){updateNotifyButton()});
}

function score(p,old){
 const liq=n(p.liquidity&&p.liquidity.usd),mc=n(p.marketCap||p.fdv),v1=n(p.volume&&p.volume.h1),v24=n(p.volume&&p.volume.h24);
 const p1=n(p.priceChange&&p.priceChange.h1),p6=n(p.priceChange&&p.priceChange.h6),p24=n(p.priceChange&&p.priceChange.h24);
 const pressure=bp(p),bu=burst(p);let s=0;
 if(mc<=500000)s+=15;else if(mc<=2000000)s+=11;else s+=6;
 if(liq>=250000)s+=20;else if(liq>=100000)s+=17;else if(liq>=50000)s+=14;else s+=9;
 const vm=mc?v24/mc:0;if(vm>=2)s+=15;else if(vm>=1)s+=12;else if(vm>=.5)s+=8;else if(vm>=.2)s+=4;
 if(v1>=150000)s+=15;else if(v1>=75000)s+=12;else if(v1>=25000)s+=9;else if(v1>=10000)s+=5;
 if(bu>=3)s+=10;else if(bu>=2)s+=8;else if(bu>=1.5)s+=6;else if(bu>=1.25)s+=3;
 if(pressure>=.68)s+=10;else if(pressure>=.60)s+=8;else if(pressure>=.55)s+=6;else if(pressure>=.50)s+=3;else if(pressure<.42)s-=5;
 const tx=n(p.txns&&p.txns.h1&&p.txns.h1.buys)+n(p.txns&&p.txns.h1&&p.txns.h1.sells);
 if(tx>=250)s+=5;else if(tx>=100)s+=4;else if(tx>=40)s+=2;else if(tx<20)s-=3;
 if(5<=p1&&p1<=30)s+=5;else if(p1>0&&p1<5)s+=2;else if(p1<-20)s-=5;
 if(10<=p6&&p6<=80)s+=5;else if(p6<-25)s-=4;
 const a=age(p);if(a<=3)s+=5;else if(a<=12)s+=4;else if(a<=24)s+=3;else if(a<=72)s+=1;
 const vl=liq?v1/liq:0;if(vl>=25)s-=25;else if(vl>=15)s-=18;else if(vl>=10)s-=10;
 if(p1>100)s-=20;else if(p1>60)s-=12;
 if(p24>800)s-=35;else if(p24>500)s-=30;else if(p24>300)s-=22;else if(p24>150)s-=15;else if(p24>100)s-=9;else if(p24>60)s-=5;
 let acc=0,has=false;
 if(old[p.pairAddress]&&n(old[p.pairAddress].v1)){has=true;acc=v1/n(old[p.pairAddress].v1);if(acc>=3)s+=7;else if(acc>=2)s+=5;else if(acc>=1.5)s+=3;else if(acc<.65)s-=2}
 return {score:Math.max(0,Math.min(100,Math.round(s))),burst:bu,accel:acc,hasAccel:has,bp:pressure};
}
function setLevelWithHysteresis(p){
 const m=p._m||{};
 const burstValue=n(m.burst),hasAccel=!!m.hasAccel,bpValue=n(m.bp);
 const p1=n(p.priceChange&&p.priceChange.h1),p24=n(p.priceChange&&p.priceChange.h24);
 let rawLevel="";
 if(m.score>=STRONG_ENTER_SCORE&&(burstValue>=2||hasAccel))rawLevel="STRONG";
 else if(m.score>=60&&(burstValue>=1.5||bpValue>=.55))rawLevel="INTERESTING";
 else if(m.score>=45&&(burstValue>=1.0||bpValue>=.48))rawLevel="WATCH";
 else if(m.score>=35&&(p24>60||p1>30||burstValue>=1.0||bpValue>=.48))rawLevel="WATCH";

 const address=p.baseToken?.address;
 let level=rawLevel;
 if(address){
  const state=strongSignals.get(address);
  if(rawLevel==="STRONG"){
   if(!state||state.level!=="STRONG"){
    strongSignals.set(address,{level:"STRONG",startedAt:Date.now(),entryScore:m.score,entryPrice:n(p.priceUsd),peakScore:m.score});
   }else{
    state.level="STRONG";
    state.peakScore=Math.max(n(state.peakScore),m.score);
   }
   level="STRONG";
  }else if(state&&state.level==="STRONG"&&m.score>=STRONG_EXIT_SCORE){
   state.peakScore=Math.max(n(state.peakScore),m.score);
   level="STRONG";
  }else if(state&&state.level==="STRONG"){
   state.level=rawLevel;
   state.exitedAt=Date.now();
   level=rawLevel;
  }
 }
 p._rawLevel=rawLevel;
 p._level=level;
 const signal=address?strongSignals.get(address):null;
 if(signal&&signal.level==="STRONG")p._signal=signal;else delete p._signal;
 return p;
}

function marketEnrich(p,old){
 const m=score(p,old);
 m.marketScore=m.score;
 p._m=m;
 p._securityReady=false;
 p._level="";
 delete p._signal;
 return setLevelWithHysteresis(p);
}

function applySecurityScore(p,onchain){
 const marketScore=n(p._m&&p._m.marketScore);
 const securityScore=n(onchain&&onchain.score);
 let finalScore=Math.round(marketScore*.70+securityScore*.30);
 const hardRisk=!!onchain&&(
  onchain.mintAuthorityRisk||
  onchain.freezeAuthorityRisk||
  n(onchain.devShare)>20||
  n(onchain.earlyShare)>60
 );
 if(hardRisk)finalScore=Math.min(finalScore,59);
 p._m.score=Math.max(0,Math.min(100,finalScore));
 p._onchain=onchain;
 p._securityReady=true;
 return setLevelWithHysteresis(p);
}

function passes(p){const liq=n(p.liquidity&&p.liquidity.usd),mc=n(p.marketCap||p.fdv),v24=n(p.volume&&p.volume.h24);return liq>=20000&&mc>=20000&&mc<=10000000&&v24>=20000}
function classify(p){const p1=n(p.priceChange&&p.priceChange.h1),p24=n(p.priceChange&&p.priceChange.h24),addr=p.baseToken?.address;return !(p1<=-40||p24<=-70)&&(!!p._level||!p._securityReady||birthCandidates.has(addr))}

async function getJSON(url){const r=await fetch(url,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
async function discover(){
 const [profiles,boosts]=await Promise.all([getJSON(API+"/token-profiles/latest/v1"),getJSON(API+"/token-boosts/latest/v1").catch(function(){return []})]);
 const addresses=[...(profiles||[]),...(boosts||[])].filter(function(x){return String(x.chainId||"").toLowerCase()==="solana"&&x.tokenAddress}).map(function(x){return x.tokenAddress});
 const unique=[...new Set(addresses)].slice(0,PROFILE_LIMIT);
 const chunks=[];for(let i=0;i<unique.length;i+=BATCH)chunks.push(unique.slice(i,i+BATCH));
 const responses=await Promise.all(chunks.map(function(c){return getJSON(API+"/tokens/v1/solana/"+c.join(","))}));
 const pairs=responses.flat().filter(function(p){return String(p.chainId||"").toLowerCase()==="solana"});
 const seen=new Set(),dedup=[];for(const p of pairs){if(!p.pairAddress||seen.has(p.pairAddress))continue;seen.add(p.pairAddress);dedup.push(p)}
 return dedup;
}

function render(){
 let list=allPairs.filter(function(p){
  const q=currentQuery.toLowerCase(),text=(p.baseToken?.symbol||"")+" "+(p.baseToken?.name||"")+" "+(p.baseToken?.address||"");
  const hit=!q||text.toLowerCase().includes(q);
  const f=currentFilter==="all"||(currentFilter==="strong"&&p._level==="STRONG")||(currentFilter==="interesting"&&p._level==="INTERESTING")||(currentFilter==="watch"&&p._level==="WATCH")||(currentFilter==="birth"&&!!p._birth)||(currentFilter==="fresh"&&age(p)<=24);
  return hit&&f;
 }).sort(function(a,b){return b._m.score-a._m.score});
 if(!list.length){document.getElementById("grid").innerHTML='<div class="empty">Nessun token corrisponde ai filtri.</div>';return}
 document.getElementById("grid").innerHTML=list.map(function(p){
  const t=p.baseToken||{},m=p._m||{},a=age(p),hot=p._level==="STRONG";
  const signalNote=hot&&p._signal?"STRONG @ "+n(p._signal.entryScore):"score";
  const initials=(t.symbol||"?").slice(0,2).toUpperCase();
  return '<article class="card'+(hot?" hot":"")+'"><div class="head"><div class="token"><div class="avatar">'+esc(initials)+'</div><div><div class="sym">'+esc(t.symbol||"?")+'</div><div class="name" title="'+esc(t.name||"")+'">'+esc(t.name||"")+'</div></div></div><div class="score"><b>'+m.score+'</b><small>'+esc(signalNote)+'</small></div></div>'+
  '<div class="badges">'+(p._level?'<span class="badge '+(hot?"red":(p._level==="WATCH"?"yellow":"green"))+'">'+(hot?"🔥 STRONG":(p._level==="WATCH"?"🟡 WATCH":"🟢 INTERESTING"))+'</span>':'')+(p._birth?'<span class="badge green">🆕 '+(p._birth.source==="pumpfun"?"PUMP.FUN":"RAYDIUM")+'</span>':'')+(n(p.priceChange&&p.priceChange.h1)>60||n(p.priceChange&&p.priceChange.h24)>150?'<span class="badge red">🔥 HOT</span>':'')+(a<=24?'<span class="badge yellow">🆕 '+a.toFixed(1)+'h</span>':'')+'<span class="badge">'+esc(p.dexId||"?")+'</span></div>'+
  '<div class="metrics"><div class="metric"><span>Liquidity</span><strong>$'+money(p.liquidity&&p.liquidity.usd)+'</strong></div><div class="metric"><span>Market Cap</span><strong>$'+money(p.marketCap||p.fdv)+'</strong></div><div class="metric"><span>Vol 1h</span><strong>$'+money(p.volume&&p.volume.h1)+'</strong></div></div>'+
  '<div class="rows"><div class="row"><span>Volume burst</span><b>'+m.burst.toFixed(2)+'x</b></div><div class="row"><span>Buy pressure</span><b>'+(m.bp*100).toFixed(1)+'%</b></div><div class="row"><span>Accelerazione</span><b>'+(m.hasAccel?m.accel.toFixed(2)+"x":"N/D")+'</b></div><div class="row"><span>Price 1h / 24h</span><b>'+pct(p.priceChange&&p.priceChange.h1)+' / '+pct(p.priceChange&&p.priceChange.h24)+'</b></div></div>'+
  '<div class="actions"><a class="buy" href="'+terminal(t.address||"")+'" target="_blank" rel="noopener">🟣 APRI TERMINAL</a><a class="dex" href="'+esc(p.url||"#")+'" target="_blank" rel="noopener">DEX</a></div></article>';
 }).join("");
}

function setStatus(text){document.getElementById("status").textContent=text}

function updateStats(){
 document.getElementById("candidates").textContent=allPairs.length;
 document.getElementById("strong").textContent=allPairs.filter(function(p){return p._level==="STRONG"}).length;
}

function rankRealtimePairs(){
 allPairs.sort(function(a,b){return b._m.score-a._m.score});
}

async function refreshRealtimeAddresses(addresses){
 const unique=[...new Set(addresses.filter(Boolean))];
 if(!unique.length)return;
 const chunks=[];
 for(let i=0;i<unique.length;i+=BATCH)chunks.push(unique.slice(i,i+BATCH));
 try{
  const old=previous();
  const responses=await Promise.all(chunks.map(function(chunk){
   return getJSON(API+"/tokens/v1/solana/"+chunk.join(","));
  }));
  const livePairs=responses.flat().filter(function(p){
   return String(p.chainId||"").toLowerCase()==="solana";
  });
  const liveByToken=new Map();
  for(const p of livePairs){
   const addr=p.baseToken?.address;
   if(addr)liveByToken.set(addr,p);
  }
  const merged=[];
  for(const current of allPairs){
   const addr=current.baseToken?.address;
   const live=addr?liveByToken.get(addr):null;
   if(live && passes(live)){
    const enriched=marketEnrich(live,old);
    const cached=securityCache.get(addr);
    if(cached&&Date.now()-cached.ts<SECURITY_CACHE_MS)applySecurityScore(enriched,cached.data);
    if(classify(enriched)) merged.push(enriched);
   }
  }
  allPairs=merged;
  rankRealtimePairs();
  updateStats();
  document.getElementById("refresh").textContent=new Date().toLocaleTimeString("it-IT");
  setStatus("Live · Solana WS");
  checkStrongNotifications(allPairs);
  render();
  await refreshOnchainSecurity(allPairs);
 }catch(e){
  setStatus("WS attivo · refresh dati in errore");
 }
}

function queueRealtimeRefresh(address){
 wsPending.add(address);
 if(wsFlushTimer)return;
 wsFlushTimer=setTimeout(async function(){
  wsFlushTimer=null;
  const addresses=[...wsPending];
  wsPending.clear();
  await refreshRealtimeAddresses(addresses);
 },WS_REFRESH_DEBOUNCE_MS);
}

function closeRealtimeSocket(){
 wsGeneration++;
 if(wsReconnectTimer){clearTimeout(wsReconnectTimer);wsReconnectTimer=null}
 if(ws)try{ws.close()}catch(e){}
 ws=null;
 wsSubIds=new Map();
 wsPairBySub=new Map();
 wsTokenByPair=new Map();
 wsBirthBySub=new Map();
}

const SOLANA_RPC_HTTP="https://api.mainnet.solana.com";
const BIRTH_PROGRAMS={
 pumpfun:"6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P",
 raydium_launchlab:"LanMV9sAd7wArD4vJFi2qDdfnVhFxYSUg6eADduJ3uj"
};
const STABLE_MINTS=new Set([
 "So11111111111111111111111111111111111111112",
 "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v",
 "Es9vMFrzaCERmJfrF4H2FYD4Y6G7S2M8xXxQ8YQYQYQYQ"
]);

async function solanaRpc(method,params){
 const r=await fetch(SOLANA_RPC_HTTP,{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({jsonrpc:"2.0",id:Date.now(),method:method,params:params}),
  cache:"no-store"
 });
 if(!r.ok)throw new Error("Solana RPC HTTP "+r.status);
 const j=await r.json();
 if(j.error)throw new Error(j.error.message||"Solana RPC error");
 return j.result;
}

async function fetchOnchainSecurity(p){
 const address=p.baseToken?.address;
 if(!address)return null;
 const cached=securityCache.get(address);
 if(cached&&Date.now()-cached.ts<SECURITY_CACHE_MS)return cached.data;

 try{
  const mintInfo=await solanaRpc("getAccountInfo",[address,{encoding:"jsonParsed",commitment:"confirmed"}]);
  const parsed=mintInfo&&mintInfo.value&&mintInfo.value.data&&mintInfo.value.data.parsed;
  const info=parsed&&parsed.info;
  if(!info)return null;

  const supply=n(info.supply);
  const mintAuthority=info.mintAuthority||null;
  const freezeAuthority=info.freezeAuthority||null;

  const largest=await solanaRpc("getTokenLargestAccounts",[address,{commitment:"confirmed"}]);
  const largestAccounts=(largest&&largest.value)||[];
  const accountAddresses=largestAccounts.slice(0,20).map(function(x){return x.address}).filter(Boolean);

  let ownerRows=[];
  if(accountAddresses.length){
   const multiple=await solanaRpc("getMultipleAccounts",[accountAddresses,{encoding:"jsonParsed",commitment:"confirmed"}]);
   const values=(multiple&&multiple.value)||[];
   ownerRows=values.map(function(acc,i){
    const ai=acc&&acc.data&&acc.data.parsed&&acc.data.parsed.info;
    return {
     address:accountAddresses[i],
     owner:ai&&ai.owner,
     amount:n(ai&&ai.tokenAmount&&ai.tokenAmount.amount)
    };
   }).filter(function(x){return !!x.owner&&x.amount>0});
  }

  const ownerMap=new Map();
  for(const row of ownerRows)ownerMap.set(row.owner,n(ownerMap.get(row.owner))+row.amount);
  const ownerBalances=[...ownerMap.values()].sort(function(a,b){return b-a});
  const top10Raw=ownerBalances.slice(0,10).reduce(function(a,b){return a+b},0);
  const top10Share=supply>0?top10Raw/supply*100:0;

  const sigs=await solanaRpc("getSignaturesForAddress",[address,{limit:60,commitment:"confirmed"}]);
  const signatures=(sigs||[]).slice().sort(function(a,b){
   const at=a.blockTime==null?Infinity:a.blockTime;
   const bt=b.blockTime==null?Infinity:b.blockTime;
   return at-bt;
  }).slice(0,10);

  let creator=null;
  const earlyOwners=new Set();
  const earlySlots=new Map();
  let firstObservedAt=null;

  for(const s of signatures.slice(0,8)){
   if(!s.signature)continue;
   let tx=null;
   try{
    tx=await solanaRpc("getTransaction",[s.signature,{
     encoding:"jsonParsed",
     commitment:"confirmed",
     maxSupportedTransactionVersion:0
    }]);
   }catch(e){}
   if(!tx)continue;

   if(!creator){
    const keys=tx.transaction?.message?.accountKeys||[];
    const signer=keys.find(function(k){return k&&k.signer});
    creator=signer?(typeof signer==="string"?signer:signer.pubkey||null):null;
   }

   const preByIndex=new Map();
   for(const b of (tx.meta?.preTokenBalances||[])){
    if(b.mint===address)preByIndex.set(n(b.accountIndex),n(b.uiTokenAmount&&b.uiTokenAmount.amount));
   }

   let txBuyerCount=0;
   for(const b of (tx.meta?.postTokenBalances||[])){
    if(b.mint!==address||!b.owner)continue;
    const post=n(b.uiTokenAmount&&b.uiTokenAmount.amount);
    const pre=n(preByIndex.get(n(b.accountIndex)));
    if(post>pre){
     earlyOwners.add(b.owner);
     txBuyerCount++;
    }
   }
   if(txBuyerCount){
    const slot=n(tx.slot);
    earlySlots.set(slot,n(earlySlots.get(slot))+txBuyerCount);
    if(!firstObservedAt)firstObservedAt=n(tx.blockTime)||null;
   }
  }

  let devShare=0;
  if(creator){
   let devAmount=0;
   for(const row of ownerRows)if(row.owner===creator)devAmount+=row.amount;
   devShare=supply>0?devAmount/supply*100:0;
  }

  let earlyAmount=0;
  for(const owner of earlyOwners)earlyAmount+=n(ownerMap.get(owner));
  const earlyShare=supply>0?earlyAmount/supply*100:0;

  const slotCounts=[...earlySlots.values()];
  const maxSameSlot=slotCounts.length?Math.max(...slotCounts):0;
  const totalEarlyBuys=slotCounts.reduce(function(a,b){return a+b},0);
  const coordinationRatio=totalEarlyBuys?maxSameSlot/totalEarlyBuys:0;

  const authorityScore=(mintAuthority&&freezeAuthority)?15:(mintAuthority||freezeAuthority)?55:100;
  const concentrationScore=top10Share<=20?100:top10Share<=35?80:top10Share<=50?60:top10Share<=70?30:0;
  const devScore=devShare<=0.5?100:devShare<=2?85:devShare<=5?65:devShare<=10?40:10;
  const earlyScore=earlyShare<=10?100:earlyShare<=20?80:earlyShare<=35?60:earlyShare<=50?25:0;
  const coordinationScore=coordinationRatio<=.30?100:coordinationRatio<=.50?70:coordinationRatio<=.70?30:0;

  const data={
   score:Math.max(0,Math.min(100,Math.round(
    authorityScore*.08+
    concentrationScore*.32+
    devScore*.22+
    earlyScore*.23+
    coordinationScore*.15
   ))),
   top10Share:top10Share,
   devShare:devShare,
   earlyShare:earlyShare,
   coordinationRatio:coordinationRatio,
   mintAuthorityRisk:!!mintAuthority,
   freezeAuthorityRisk:!!freezeAuthority,
   creator:creator,
   firstObservedAt:firstObservedAt
  };

  securityCache.set(address,{ts:Date.now(),data:data});
  return data;
 }catch(e){
  return null;
 }
}

async function refreshOnchainSecurity(pairs){
 if(securityBusy)return;
 const targets=pairs
  .filter(function(p){return p.baseToken?.address&&n(p._m&&p._m.marketScore)>=50})
  .sort(function(a,b){return n(b._m&&b._m.marketScore)-n(a._m&&a._m.marketScore)})
  .slice(0,SECURITY_MAX_TOKENS);
 if(!targets.length)return;

 securityBusy=true;
 try{
  for(const p of targets){
   const data=await fetchOnchainSecurity(p);
   if(data)applySecurityScore(p,data);
  }
  rankRealtimePairs();
  updateStats();
  checkStrongNotifications(allPairs);
  render();
 }finally{
  securityBusy=false;
 }
}

function extractPubkey(x){
 if(!x)return "";
 if(typeof x==="string")return x;
 return x.pubkey||"";
}

function extractBirthMints(tx,source){
 const out=new Set();
 function walk(v,depth){
  if(!v||depth>9)return;
  if(Array.isArray(v)){for(const x of v)walk(x,depth+1);return}
  if(typeof v!=="object")return;
  const parsed=v.parsed;
  if(parsed&&typeof parsed==="object"){
   const type=String(parsed.type||"").toLowerCase();
   const mint=parsed.info&&parsed.info.mint;
   if(mint&&type.includes("initializemint"))out.add(mint);
  }
  for(const k of Object.keys(v)){
   if(k==="returnData"||k==="logMessages")continue;
   walk(v[k],depth+1);
  }
 }
 walk(tx.transaction?.message?.instructions,0);
 walk(tx.meta?.innerInstructions,0);
 for(const b of (tx.meta?.postTokenBalances||[]))if(b.mint)out.add(b.mint);
 if(source==="pumpfun"){
  const keys=(tx.transaction?.message?.accountKeys||[]).map(extractPubkey);
  if(keys[1])out.add(keys[1]);
 }
 for(const mint of [...out])if(!mint||STABLE_MINTS.has(mint))out.delete(mint);
 return [...out];
}

function birthLogMatches(source,logs){
 const joined=(logs||[]).join(" ");
 if(source==="pumpfun")return joined.includes("InitializeMint2")||joined.includes("Instruction: Create");
 if(source==="raydium_launchlab")return joined.includes("Instruction: Initialize");
 return false;
}

function scheduleBirthResolve(){
 if(birthResolveTimer)return;
 birthResolveTimer=setTimeout(function(){
  birthResolveTimer=null;
  resolveBirthCandidates();
 },800);
}

function registerBirthMint(mint,source,signature){
 if(!mint)return;
 const old=birthCandidates.get(mint);
 birthCandidates.set(mint,Object.assign(
  {mint:mint,source:source,firstSeen:Date.now(),signature:signature,resolved:false},
  old||{}
 ));
 scheduleBirthResolve();
}

async function processBirthTransaction(source,signature,logs){
 if(!signature||birthSeenSignatures.has(signature)||!birthLogMatches(source,logs))return;
 birthSeenSignatures.add(signature);
 if(birthSeenSignatures.size>5000){
  const first=birthSeenSignatures.values().next().value;
  if(first)birthSeenSignatures.delete(first);
 }
 let tx=null;
 for(let i=0;i<3&&!tx;i++){
  try{
   tx=await solanaRpc("getTransaction",[signature,{
    encoding:"jsonParsed",
    commitment:"confirmed",
    maxSupportedTransactionVersion:0
   }]);
  }catch(e){}
  if(!tx&&i<2)await new Promise(function(resolve){setTimeout(resolve,180*(i+1))});
 }
 if(!tx)return;
 for(const mint of extractBirthMints(tx,source))registerBirthMint(mint,source,signature);
}

function birthEligible(p){
 const liq=n(p.liquidity&&p.liquidity.usd);
 const mc=n(p.marketCap||p.fdv);
 const v1=n(p.volume&&p.volume.h1);
 const buys=n(p.txns&&p.txns.h1&&p.txns.h1.buys);
 return liq>=1500&&mc>=3000&&mc<=10000000&&(v1>=250||buys>=2);
}

async function resolveBirthCandidates(){
 const now=Date.now();
 const pending=[...birthCandidates.values()].filter(function(x){
  return !x.resolved&&now-x.firstSeen<60000;
 });
 if(!pending.length)return;
 const addresses=pending.map(function(x){return x.mint});
 const chunks=[];
 for(let i=0;i<addresses.length;i+=BATCH)chunks.push(addresses.slice(i,i+BATCH));
 try{
  const responses=await Promise.all(chunks.map(function(chunk){
   return getJSON(API+"/tokens/v1/solana/"+chunk.join(","));
  }));
  const livePairs=responses.flat().filter(function(p){
   return String(p.chainId||"").toLowerCase()==="solana";
  });
  const old=previous();
  const found=new Map();
  for(const p of livePairs){
   const addr=p.baseToken?.address;
   const meta=addr?birthCandidates.get(addr):null;
   if(!meta||(!birthEligible(p)&&!passes(p)))continue;
   const enriched=marketEnrich(p,old);
   enriched._birth=meta;
   found.set(addr,enriched);
   meta.resolved=true;
  }
  if(found.size){
   const byToken=new Map(allPairs.map(function(p){return [p.baseToken?.address,p]}));
   for(const [addr,p] of found)byToken.set(addr,p);
   allPairs=[...byToken.values()].sort(function(a,b){return b._m.score-a._m.score});
   updateStats();
   document.getElementById("refresh").textContent=new Date().toLocaleTimeString("it-IT");
   setStatus("Live · Birth Radar · Solana WS");
   checkStrongNotifications(allPairs);
   render();
   refreshOnchainSecurity(allPairs);
  }
  if([...birthCandidates.values()].some(function(x){
   return !x.resolved&&Date.now()-x.firstSeen<60000;
  }))scheduleBirthResolve();
 }catch(e){scheduleBirthResolve()}
}

function connectRealtimeSocket(){
 closeRealtimeSocket();
 const generation=wsGeneration;
 const pairs=[...allPairs]
   .filter(function(p){return p.pairAddress})
   .sort(function(a,b){return b._m.score-a._m.score})
   .slice(0,WS_MAX_PAIRS);

 try{
  ws=new WebSocket(WS_URL);
 }catch(e){
  setStatus("WS non disponibile · fallback");
  return;
 }

 ws.onopen=function(){
  if(generation!==wsGeneration)return;
  setStatus("Live · Solana WS + Birth Radar");
  let id=1;
  Object.keys(BIRTH_PROGRAMS).forEach(function(source){
   const subId=10000+id++;
   wsBirthBySub.set(subId,source);
   ws.send(JSON.stringify({
    jsonrpc:"2.0",
    id:subId,
    method:"logsSubscribe",
    params:[{mentions:[BIRTH_PROGRAMS[source]]},{commitment:"processed"}]
   }));
  });
  pairs.forEach(function(p){
   const subId=id++;
   wsSubIds.set(p.pairAddress,subId);
   wsPairBySub.set(subId,p.pairAddress);
   wsTokenByPair.set(p.pairAddress,p.baseToken?.address);
   ws.send(JSON.stringify({
    jsonrpc:"2.0",
    id:subId,
    method:"logsSubscribe",
    params:[{mentions:[p.pairAddress]},{commitment:"processed"}]
   }));
  });
 };

 ws.onmessage=function(event){
  if(generation!==wsGeneration)return;
  try{
   const msg=JSON.parse(event.data);
   if(msg.error){setStatus("WS · errore sottoscrizione");return}
   if(msg.method!=="logsNotification")return;
   const subscription=msg.params?.subscription;
   const source=wsBirthBySub.get(subscription);
   if(source){
    const value=msg.params?.result?.value||{};
    if(!value.err)processBirthTransaction(source,value.signature,value.logs||[]);
    return;
   }
   const pair=wsPairBySub.get(subscription);
   const token=pair?wsTokenByPair.get(pair):null;
   if(token)queueRealtimeRefresh(token);
  }catch(e){}
 };

 ws.onerror=function(){
  if(generation!==wsGeneration)return;
  setStatus("WS in errore · fallback");
 };

 ws.onclose=function(){
  if(generation!==wsGeneration)return;
  setStatus("WS riconnessione…");
  if(wsReconnectTimer)return;
  wsReconnectTimer=setTimeout(function(){
   wsReconnectTimer=null;
   connectRealtimeSocket();
  },WS_RECONNECT_MS);
 };
}

function startFallbackMonitor(){
 if(fallbackTimer)return;
 fallbackTimer=setInterval(function(){
  if(!ws || ws.readyState!==WebSocket.OPEN) monitorScan();
 },FALLBACK_MONITOR_MS);
}

async function dedupeAndRank(pairs,old){
 const filtered=pairs.filter(function(p){
  const birth=birthCandidates.get(p.baseToken?.address);
  return passes(p)||(birth&&birthEligible(p));
 }).map(function(p){
  const x=marketEnrich(p,old);
  const birth=birthCandidates.get(p.baseToken?.address);
  if(birth)x._birth=birth;
  return x;
 }).filter(classify);
 filtered.sort(function(a,b){return b._m.score-a._m.score});
 const byToken=new Map();
 for(const p of filtered){
  const k=p.baseToken?.address||p.pairAddress;
  if(!byToken.has(k)||p._birth)byToken.set(k,p);
 }
 return [...byToken.values()];
}

async function discoverScan(){
 document.getElementById("status").textContent="Discovery DexScreener…";
 try{
  const old=previous(),pairs=await discover();
  allPairs=await dedupeAndRank(pairs,old);
  const next={};
  for(const p of allPairs) next[p.pairAddress]={v1:n(p.volume&&p.volume.h1),ts:Date.now()};
  savePrevious(next);
  document.getElementById("pairs").textContent=pairs.length;
  document.getElementById("candidates").textContent=allPairs.length;
  document.getElementById("strong").textContent=allPairs.filter(function(p){return p._level==="STRONG"}).length;
  document.getElementById("refresh").textContent=new Date().toLocaleTimeString("it-IT");
  document.getElementById("status").textContent="Live · discovery 30s · Birth Radar · 80 token";
  checkStrongNotifications(allPairs);
  render();
  await refreshOnchainSecurity(allPairs);
  connectRealtimeSocket();
 }catch(e){
  document.getElementById("status").textContent="Errore DexScreener";
  document.getElementById("grid").innerHTML='<div class="empty"><b>Impossibile leggere DexScreener.</b><br><br>'+esc(e.message)+'</div>';
 }
}

async function monitorScan(){
 if(!allPairs.length)return;
 const addresses=[...new Set(allPairs.map(function(p){return p.baseToken?.address}).filter(Boolean))];
 if(!addresses.length)return;
 try{
  const old=previous();
  const chunks=[];
  for(let i=0;i<addresses.length;i+=BATCH)chunks.push(addresses.slice(i,i+BATCH));
  const responses=await Promise.all(chunks.map(function(chunk){
   return getJSON(API+"/tokens/v1/solana/"+chunk.join(","));
  }));
  const livePairs=responses.flat().filter(function(p){return String(p.chainId||"").toLowerCase()==="solana"});
  const previousCount=allPairs.length;
  const updated=await dedupeAndRank(livePairs,old);
  allPairs=updated;
  document.getElementById("candidates").textContent=allPairs.length;
  document.getElementById("strong").textContent=allPairs.filter(function(p){return p._level==="STRONG"}).length;
  document.getElementById("refresh").textContent=new Date().toLocaleTimeString("it-IT");
  document.getElementById("status").textContent="Live · fallback 10s · Solana WS";
  checkStrongNotifications(allPairs);
  render();
 }catch(e){
  document.getElementById("status").textContent="Live · monitor in pausa";
 }
}

document.getElementById("search").oninput=function(e){currentQuery=e.target.value;render()};
