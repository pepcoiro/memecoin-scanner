name: Memecoin Scanner

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memecoin-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore scanner state
        uses: actions/cache/restore@v4
        with:
          path: |
            scanner_state.json
            wallet_state.json
            telegram_alert_state.json
          key: scanner-state-${{ github.run_id }}
          restore-keys: |
            scanner-state-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scanner
        env:
          GOPLUS_APP_KEY: ${{ secrets.GOPLUS_APP_KEY }}
          GOPLUS_APP_SECRET: ${{ secrets.GOPLUS_APP_SECRET }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Save scanner state
        uses: actions/cache/save@v4
        with:
          path: |
            scanner_state.json
            wallet_state.json
            telegram_alert_state.json
          key: scanner-state-${{ github.run_id }}
