name: Memecoin Scanner

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "site/data.json"
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: memecoin-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore scanner state
        uses: actions/cache/restore@v4
        with:
          path: |
            scanner_state.json
            telegram_alert_state.json
          key: scanner-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            scanner-state-${{ github.ref_name }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scanner
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
        run: python scanner.py

      - name: Publish dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          if git diff --cached --quiet; then
            echo "Dashboard data unchanged."
          else
            git commit -m "Update scanner dashboard data"
            git push
          fi

      - name: Save scanner state
        uses: actions/cache/save@v4
        with:
          path: |
            scanner_state.json
            telegram_alert_state.json
          key: scanner-state-${{ github.ref_name }}-${{ github.run_id }}
